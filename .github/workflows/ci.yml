name: CI

on:
  pull_request:
  push:
    branches: [devel]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy --strict src
      - run: uv run pytest

  # Runs the PostgreSQL persistence tests against a real database.
  # No Kubernetes cluster required.
  test-integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      EP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - name: Bootstrap execution_plane database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres postgres \
            -c "CREATE ROLE execution_plane_runtime LOGIN" \
            -c "CREATE DATABASE execution_plane OWNER postgres"

      - name: Run Alembic migrations
        run: uv run alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ env.EP_DATABASE_URL }}

      - name: Run PostgreSQL persistence tests
        run: uv run pytest tests/integration/test_postgres_persistence_types.py -v

  # Runs the end-to-end dispatch test, which requires both PostgreSQL and a
  # live kind (Kubernetes-in-Docker) cluster. Kept as a separate job so the
  # postgres-only check above stays fast and clearly labelled.
  test-integration-postgres-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      EP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --all-groups

      - name: Bootstrap execution_plane database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres postgres \
            -c "CREATE ROLE execution_plane_runtime LOGIN" \
            -c "CREATE DATABASE execution_plane OWNER postgres"

      # EXPERIMENTAL: run the kind cluster on the podman provider instead of
      # docker (reviewer preference; local dev already uses kind-on-podman).
      # kind on rootless podman needs cgroup v2 + systemd user-delegation and
      # the cgroupfs cgroup manager; GitHub's Ubuntu runner provides cgroup v2,
      # so configure both before creating the cluster. The postgres service
      # container above still runs on docker (GitHub manages service containers
      # with docker); the two runtimes coexist on the runner.
      - name: Prepare podman for kind (rootless cgroup delegation)
        run: |
          set -euo pipefail
          # Cgroup delegation: let the rootless podman user manage its own subtree.
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=yes\n' \
            | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          # Use the cgroupfs cgroup manager instead of systemd. On GitHub Actions
          # runners the runner process lives in a system-slice cgroup, not the
          # user's systemd session, so the rootless network process
          # (pasta/slirp4netns) ends up in a cgroup the runner user cannot signal
          # — causing "kill network process: permission denied" during container
          # cleanup. With cgroupfs, podman owns its cgroup subtree directly and
          # kill() succeeds.
          mkdir -p ~/.config/containers
          printf '[engine]\ncgroup_manager = "cgroupfs"\n' \
            > ~/.config/containers/containers.conf
          podman --version
          podman info | grep -iE 'cgroup' || true

      # Stand up a throwaway kind cluster on podman. The dispatcher
      # ServiceAccount and RBAC in execution-plane-init.yaml grant the bearer
      # token the permissions the vanilla-k8s transport needs (pod list,
      # portforward, job CRUD).
      - name: Create kind cluster
        uses: helm/kind-action@v1
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman
        with:
          cluster_name: integration-test

      - name: Provision dispatcher ServiceAccount and RBAC
        run: kubectl apply -f docs/feature-branch-assets/execution-plane-init.yaml

      # The transport runs node pods with imagePullPolicy: IfNotPresent. The kind
      # node is a podman container, so pull the image directly into the node's
      # containerd k8s.io namespace (what kubelet's IfNotPresent check uses) via
      # crictl, rather than `docker pull` + `kind load` which assume docker.
      - name: Pre-pull the script node image into kind
        run: |
          podman exec integration-test-control-plane \
            crictl pull quay.io/ahetheri/syntara-node-script:migration-test

      - name: Export cluster coordinates for the test suite
        run: |
          set -euo pipefail
          endpoint="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          token="$(kubectl create token syntara-dispatcher -n execution-plane --duration=2h)"
          echo "::add-mask::${token}"
          ca_cert_pem="$(kubectl config view --minify --raw \
            -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d)"
          {
            echo "EP_IT_K8S_ENDPOINT=${endpoint}"
            echo "EP_IT_K8S_TOKEN=${token}"
            echo "EP_IT_K8S_NAMESPACE=execution-plane"
            printf "EP_IT_K8S_CA_CERT<<EOF\n%s\nEOF\n" "${ca_cert_pem}"
          } >> "$GITHUB_ENV"

      - name: Run Alembic migrations
        run: uv run alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ env.EP_DATABASE_URL }}

      - name: Run cluster dispatch integration tests
        run: uv run pytest tests/integration/test_dispatch.py -m integration -v --timeout=600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            integration-test-logs/
          retention-days: 7
          if-no-files-found: ignore

      # Delete the cluster ourselves before helm/kind-action's post-job hook does.
      # The rootless network helper (pasta/slirp4netns) for the kind node ends up
      # in a cgroup the runner user cannot signal, so podman's cleanup gets
      # "kill network process: permission denied" (EPERM). Killing the helper with
      # sudo first makes podman's own kill() return ESRCH ("already gone"), which
      # podman treats as success, so the deletion completes and the post-job hook
      # then finds no cluster and exits cleanly.
      - name: Pre-delete kind cluster (workaround rootless netns kill permission)
        if: always()
        env:
          KIND_EXPERIMENTAL_PROVIDER: podman
        run: |
          sudo pkill -x pasta 2>/dev/null || sudo pkill -x slirp4netns 2>/dev/null || true
          sleep 1
          kind delete cluster --name integration-test 2>/dev/null || true

  container:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/syntara-orchestration/execution-plane
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
