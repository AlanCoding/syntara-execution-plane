name: CI

on:
  pull_request:
  push:
    branches: [devel]

permissions:
  contents: read

jobs:
  lint-types-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy --strict src
      - run: uv run pytest

  # Validate the container image builds on every change. Publishing happens
  # separately on version tags (see .github/workflows/release.yml); both share
  # the build via the container-build composite action.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/container-build
