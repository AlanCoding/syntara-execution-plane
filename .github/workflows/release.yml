---
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-client:
    name: Publish execution-plane-client to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/execution-plane-client/
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags so hatch-vcs derives the version from the
          # repository tags. fetch-depth: 0 alone does not fetch tags on a
          # branch ref (only on a tag checkout), which makes manual dispatch
          # builds derive 0.0.1.devN instead of X.Y.(Z+1).devN.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Build the client distribution
        # --out-dir dist so the publish action (and the guard below) find the
        # artifacts at the repository root; uv build's default output is
        # <package>/dist/.
        run: uv build --out-dir dist ./src/execution_plane_client/

      - name: Publish package distributions to PyPI
        # Tag pushes only: a manual dispatch on a branch derives a dev version
        # (X.Y.(Z+1).devN+g<sha>) and must never reach the registry.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/syntara-orchestration/execution-plane
          tags: |
            type=ref,event=tag
            type=sha
      - uses: ./.github/actions/container-build
        with:
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
