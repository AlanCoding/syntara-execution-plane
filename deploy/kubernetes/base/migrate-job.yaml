apiVersion: batch/v1
kind: Job
metadata:
  name: execution-plane-migrate
  labels:
    app.kubernetes.io/name: execution-plane
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-plane
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/syntara-orchestration/execution-plane:latest
          command: [alembic, -c, alembic.ini, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-plane-db
                  key: migrator-url
            - name: EP_CREDENTIAL_ENCRYPTION_KEY_PATH
              value: /run/secrets/ep/credential-encryption-key
          volumeMounts:
            - name: ep-key
              mountPath: /run/secrets/ep
              readOnly: true
      volumes:
        - name: ep-key
          secret:
            secretName: execution-plane-keys
            items:
              - key: credential-encryption-key
                path: credential-encryption-key
